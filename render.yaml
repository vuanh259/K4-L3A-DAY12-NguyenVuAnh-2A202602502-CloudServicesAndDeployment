# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# Render generates the API key in its secret environment, never in Git.

services:
  - type: web
    name: day12-agent-nguyenvuanh
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /ready
    autoDeployTrigger: 'off'
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis-nguyenvuanh
          type: redis
          property: connectionString

  - type: redis
    name: day12-redis-nguyenvuanh
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
